<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071b33">

  <meta name="interface-scale" content="1.30">

  <link rel="manifest" href="manifest.webmanifest">

  <title>Rapports D’étalonnages</title>

  <style>
    :root{
      --interface-scale: 1.20;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:#071b33;
      overflow:hidden;
    }

    body{
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    }

    #app{
      width:calc(100% / var(--interface-scale));
      height:calc(100% / var(--interface-scale));
      border:0;
      display:block;

      transform:scale(var(--interface-scale));
      transform-origin:top left;
    }

    #loading{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      background:#071b33;
      color:white;
      z-index:2;
    }

    .box{
      text-align:center;
    }

    .box img{
      width:96px;
      height:96px;
      border-radius:22px;
      display:block;
      margin:0 auto 18px;
    }

    .box div{
      font-size:18px;
      font-weight:600;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="box">
      <img src="icons/icon-192.png" alt="CDQ">
      <div>Rapports D’étalonnages</div>
    </div>
  </div>

  <div id="app" aria-label="Ouverture de l’application"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }

    const APP_URL = 'https://script.google.com/macros/s/AKfycbwpMBmpS9DJ-BfZ09oTi_pV9n707hc6FyhA1EgMUjxHHIXM-cmlcYhoGWn8bsVYp4Sz/exec';
    window.location.replace(APP_URL);
  </script>

</body>
</html>
