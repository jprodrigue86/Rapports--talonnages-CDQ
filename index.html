<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071b33">
  <meta name="interface-scale" content="1.30">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Rapports D’étalonnages</title>
  <style>
    :root{
      --interface-scale:1.20;
    }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:#071b33;
      overflow:hidden;
    }
    body{
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    }
    #app{
      width:calc(100% / var(--interface-scale));
      height:calc(100% / var(--interface-scale));
      border:0;
      display:block;
      transform:scale(var(--interface-scale));
      transform-origin:top left;
    }
    #loading{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:
        radial-gradient(circle at 18% 18%,rgba(195,23,23,.18),transparent 28%),
        radial-gradient(circle at 82% 28%,rgba(128,0,0,.16),transparent 26%),
        radial-gradient(circle at 50% 82%,rgba(90,0,0,.14),transparent 32%),
        linear-gradient(180deg,#000000 0%,#040404 35%,#090909 100%);
      color:white;
      z-index:2;
      isolation:isolate;
    }
    #loading::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        repeating-linear-gradient(135deg,rgba(255,255,255,.022) 0 2px,transparent 2px 10px),
        repeating-linear-gradient(45deg,rgba(255,255,255,.015) 0 1px,transparent 1px 7px),
        linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.18));
      mix-blend-mode:screen;
      opacity:.65;
      pointer-events:none;
    }
    #loading::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.72));
      box-shadow:inset 0 0 160px rgba(0,0,0,.9);
      pointer-events:none;
    }
    .metal-wall{
      position:absolute;
      inset:-8%;
      display:grid;
      grid-template-columns:repeat(6,minmax(0,1fr));
      align-content:space-evenly;
      gap:0;
      padding:12px;
      transform:rotate(-5deg) scale(1.12);
      opacity:.38;
      color:#d8d8da;
      font-weight:950;
      text-transform:uppercase;
      text-align:center;
      letter-spacing:.035em;
      user-select:none;
      pointer-events:none;
      text-shadow:0 0 10px rgba(255,255,255,.08),0 0 20px rgba(255,30,30,.08);
    }
    .metal-wall span{
      white-space:nowrap;
      font-size:clamp(6px,1.55vw,12px);
      line-height:.78;
      margin:-3px -8px;
      transform:rotate(-2deg);
      filter:drop-shadow(0 0 7px rgba(0,0,0,.95));
    }
    .metal-wall span:nth-child(2n){transform:translateY(-3px) rotate(2deg);}
    .metal-wall span:nth-child(3n){transform:translateX(-6px) translateY(2px) rotate(-4deg);}
    .metal-wall span:nth-child(5n){transform:translateX(7px) translateY(-4px) rotate(4deg);}
    .metal-wall span:nth-child(7n+1),.metal-wall span:nth-child(11n+3){
      color:#ff3c3c;
      font-size:clamp(7px,1.85vw,14px);
      z-index:1;
    }
    @media(max-width:600px){
      .metal-wall{grid-template-columns:repeat(6,minmax(0,1fr));padding:6px;opacity:.36;}
      .metal-wall span{font-size:clamp(5px,1.75vw,9.5px);margin:-3px -7px;line-height:.72;}
      .metal-wall span:nth-child(7n+1),.metal-wall span:nth-child(11n+3){font-size:clamp(6px,2vw,11px);}
    }
    .box{
      position:relative;
      z-index:1;
      width:min(310px,78vw);
      padding:28px 22px 24px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:28px;
      background:rgba(8,10,13,.78);
      box-shadow:0 18px 60px rgba(0,0,0,.58),inset 0 1px rgba(255,255,255,.07);
      backdrop-filter:blur(7px);
      text-align:center;
    }
    .box img{
      width:118px;
      height:118px;
      border-radius:22px;
      display:block;
      margin:0 auto 18px;
      box-shadow:0 8px 26px rgba(0,0,0,.5);
    }
    .loading-title{
      font-size:19px;
      font-weight:750;
      letter-spacing:.01em;
    }
    .loading-label{
      margin-top:8px;
      color:#bdc3cc;
      font-size:13px;
      font-weight:600;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .loading-bar{
      height:4px;
      margin:18px auto 0;
      overflow:hidden;
      border-radius:999px;
      background:rgba(255,255,255,.12);
    }
    .loading-bar::after{
      content:"";
      display:block;
      width:42%;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,#8f1111,#ff4747,#8f1111);
      animation:metal-loading 1.15s ease-in-out infinite;
    }
    @keyframes metal-loading{
      0%{transform:translateX(-110%);}
      100%{transform:translateX(340%);}
    }
    @media (prefers-reduced-motion:reduce){
      .loading-bar::after{animation:none;width:100%;opacity:.7;}
    }

    #auth-help{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(7,27,51,.96);
      color:#fff;
      z-index:10;
      padding:24px;
      box-sizing:border-box;
    }
    #auth-help .auth-card{
      width:min(430px,92vw);
      background:#0d2948;
      border-radius:22px;
      padding:28px 24px;
      box-sizing:border-box;
      text-align:center;
      box-shadow:0 12px 40px rgba(0,0,0,.35);
    }
    #auth-help h2{
      margin:0 0 12px;
      font-size:22px;
    }
    #auth-help p{
      margin:0 0 22px;
      line-height:1.45;
      font-size:16px;
    }
    #auth-help button{
      width:100%;
      min-height:50px;
      border:0;
      border-radius:14px;
      font-size:17px;
      font-weight:700;
      cursor:pointer;
      margin-top:10px;
    }
    #auth-open{
      background:#43c98b;
      color:#071b33;
    }
    #auth-retry{
      background:#173a5f;
      color:#fff;
    }
    #auth-help .small{
      margin-top:14px;
      font-size:13px;
      opacity:.78;
    }

    /* =====================================================
       MUR MUSICAL — CHOIX 1 SOMBRE / GRUNGE
    ===================================================== */
    #loading{
      background:#000!important;
      isolation:isolate;
    }
    .music-wall-image{
      position:absolute;
      inset:-1px;
      z-index:-3;
      background-image:url("assets/music-wall-choice1.webp");
      background-size:cover;
      background-position:center center;
      background-repeat:no-repeat;
      filter:brightness(.56) contrast(1.10) saturate(.86);
      transform:scale(1.015);
    }
    #loading::before{
      z-index:-2;
      background:
        radial-gradient(circle at 50% 44%,rgba(0,0,0,.02) 0 20%,rgba(0,0,0,.18) 58%,rgba(0,0,0,.50) 100%),
        linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.06) 48%,rgba(0,0,0,.50));
      mix-blend-mode:normal;
      opacity:1;
    }
    #loading::after{
      z-index:-1;
      background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.18) 58%,rgba(0,0,0,.60));
      box-shadow:inset 0 0 150px rgba(0,0,0,.70);
    }
    #loading .box{
      width:min(260px,72vw);
      padding:18px 18px 16px;
      border:1px solid rgba(255,255,255,.14);
      border-radius:22px;
      background:rgba(0,0,0,.66);
      box-shadow:0 18px 55px rgba(0,0,0,.72),inset 0 1px rgba(255,255,255,.05);
      backdrop-filter:blur(6px);
    }
    #loading .box img{
      width:88px;
      height:88px;
      margin:0 auto 12px;
      border-radius:18px;
    }
    #loading .loading-title{font-size:17px;}
    #loading .loading-label{margin-top:6px;font-size:11px;}
    #loading .loading-bar{margin-top:13px;}
    @media(min-width:900px){
      .music-wall-image{background-size:cover;background-position:center 44%;}
      #loading .box{width:280px;}
    }

  </style>
</head>
<body>
  <div id="loading">
    <div class="music-wall-image" aria-hidden="true"></div>
    <div class="box">
      <img src="icons/icon-heavy-v3-512.png" alt="Balance CDQ">
      <div class="loading-title">Rapports D’étalonnages</div>
      <div class="loading-label">Chargement</div>
      <div class="loading-bar" aria-hidden="true"></div>
    </div>
  </div>

  <iframe
    id="app"
    title="Rapports D’étalonnages"
    src="https://script.google.com/macros/s/AKfycbzZt5zgKLJA3FlRXgJOqR8OLopFBkCg8vapy4fLMNM37rlrYv0U__p8V22O_QAq5gk/exec?cdq_deploy=224"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <div id="auth-help" aria-live="polite">
    <div class="auth-card">
      <h2>🔐 Autorisation Google</h2>
      <p>Pour un nouvel utilisateur, Google doit d’abord autoriser l’application. Ouvre l’application Google ci-dessous, termine l’autorisation, puis reviens ici.</p>
      <button id="auth-open">Ouvrir l’autorisation Google</button>
      <button id="auth-retry">J’ai autorisé — réessayer</button>
      <div class="small">L’application installée, son icône et son fonctionnement normal ne changent pas.</div>
    </div>
  </div>

  <script>
    const CDQ_PWA_BUILD = '2026.09.10.2017';
    let swRegistration = null;
    let reloadingForUpdate = false;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'})
        .then(reg => {
          swRegistration = reg;
          reg.update().catch(()=>{});
        })
        .catch(()=>{});

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloadingForUpdate) return;
        reloadingForUpdate = true;
        window.location.reload();
      });
    }

    const app = document.getElementById('app');
    const loading = document.getElementById('loading');
    const authHelp = document.getElementById('auth-help');

    const APP_URL = 'https://script.google.com/macros/s/AKfycbzZt5zgKLJA3FlRXgJOqR8OLopFBkCg8vapy4fLMNM37rlrYv0U__p8V22O_QAq5gk/exec?cdq_deploy=224';
    const MIN_LOADING_MS = 1000;
    let loadingShownAt = performance.now();
    let appLoadCount = 0;

    function afficherMurChargement() {
      loadingShownAt = performance.now();
      loading.style.display = 'grid';
    }

    function masquerMurApresDelaiMinimum() {
      const elapsed = performance.now() - loadingShownAt;
      const remaining = Math.max(0, MIN_LOADING_MS - elapsed);
      setTimeout(() => {
        loading.style.display = 'none';
      }, remaining);
    }

    app.addEventListener('load', () => {
      appLoadCount++;
      masquerMurApresDelaiMinimum();
    });

    function ouvrirAutorisation() {
      window.open(APP_URL, '_blank', 'noopener');
    }

    function reessayer() {
      authHelp.style.display = 'none';
      afficherMurChargement();
      const separator = APP_URL.indexOf('?') === -1 ? '?' : '&';
      app.src = APP_URL + separator + 'cdq_retry=' + Date.now();
    }

    async function lireVersionDistante() {
      try {
        const response = await fetch('./version.json?ts=' + Date.now(), {cache:'no-store'});
        if (!response.ok) throw new Error('version unavailable');
        const data = await response.json();
        return String(data.version || CDQ_PWA_BUILD);
      } catch (e) {
        return CDQ_PWA_BUILD;
      }
    }

    async function repondreEtatMiseAJour(source, buildSelector) {
      const latest = await lireVersionDistante();
      const current = String(buildSelector || CDQ_PWA_BUILD);
      const available = latest.localeCompare(current, undefined, {numeric:true}) > 0;
      try {
        source.postMessage({type:'CDQ_UPDATE_STATUS',available,latest,current}, '*');
      } catch (e) {}
    }

    async function forcerMiseAJour(source) {
      try {
        const keys = await caches.keys();
        await Promise.all(keys.filter(k => k.indexOf('cdq-installable-') === 0).map(k => caches.delete(k)));
      } catch (e) {}

      if ('serviceWorker' in navigator) {
        try {
          const reg = swRegistration || await navigator.serviceWorker.getRegistration();
          if (reg) {
            await reg.update();
            if (reg.waiting) {
              reg.waiting.postMessage({type:'SKIP_WAITING'});
              return;
            }
          }
        } catch (e) {}
      }

      try { source.postMessage({type:'CDQ_UPDATE_RELOAD'}, '*'); } catch (e) {}
      window.location.reload();
    }

    window.addEventListener('message', event => {
      const data = event.data || {};
      if (data.type === 'CDQ_CHECK_UPDATE') {
        repondreEtatMiseAJour(event.source, data.build);
      }
      if (data.type === 'CDQ_FORCE_UPDATE') {
        forcerMiseAJour(event.source);
      }
    });

    document.getElementById('auth-open').addEventListener('click', ouvrirAutorisation);
    document.getElementById('auth-retry').addEventListener('click', reessayer);

    setTimeout(() => {
      if (appLoadCount === 0) {
        loading.style.display = 'none';
        authHelp.style.display = 'flex';
      }
    }, 10000);
  </script>
</body>
</html>
