<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071b33">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Rapports D’étalonnages</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#071b33;overflow:hidden}
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    #app{width:100%;height:100%;border:0;display:block}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#071b33;color:white;z-index:2}
    .box{text-align:center}
    .box img{width:96px;height:96px;border-radius:22px;display:block;margin:0 auto 18px}
    .box div{font-size:18px;font-weight:600}
  </style>
</head>
<body>
  <div id="loading">
    <div class="box">
      <img src="icons/icon-192.png" alt="CDQ">
      <div>Rapports D’étalonnages</div>
    </div>
  </div>
  <iframe id="app" title="Rapports D’étalonnages"
          src="https://script.google.com/macros/s/AKfycbziLQFsu8NwLAuvq4lKTERjEoizjneipWESIHzA50pcAPBz8KUoHBphBzbYL9OR9jP3/exec?v=40"
          allow="clipboard-read; clipboard-write"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
    document.getElementById('app').addEventListener('load', () => {
      document.getElementById('loading').style.display = 'none';
    });
  </script>
</body>
</html>
