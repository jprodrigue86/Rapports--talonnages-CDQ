<script id="cdqV2156ShareRestore">
(function(){
'use strict';
const CDQ_INSTALL_URL_PUBLIC='https://jprodrigue86.github.io/Rapports--talonnages-CDQ/installer.html';
function messageInstallation(){return 'Installer Balance CDQ : '+CDQ_INSTALL_URL_PUBLIC+'\n\nAprès l’installation, ouvrez l’icône Étalonnages et connectez-vous avec votre compte Google.';}
function info(msg){try{if(typeof afficherMessage==='function'){afficherMessage(msg,true);return;}}catch(e){}try{console.log(msg);}catch(e){}}
async function copierLien(){try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(CDQ_INSTALL_URL_PUBLIC);info('Lien d’installation copié.');return;}}catch(e){}try{prompt('Copiez le lien d’installation :',CDQ_INSTALL_URL_PUBLIC);}catch(e){}}
async function partagerLien(){const data={title:'Installer Balance CDQ',text:'Installer Balance CDQ',url:CDQ_INSTALL_URL_PUBLIC};if(navigator.share){try{await navigator.share(data);return;}catch(e){if(e&&e.name==='AbortError')return;}}await copierLien();}
function envoyerCourriel(email){email=String(email||'').trim();location.href='mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent('Installation Balance CDQ')+'&body='+encodeURIComponent(messageInstallation());}
function envoyerSms(numero){numero=String(numero||'').replace(/[^0-9+]/g,'');const body=encodeURIComponent(messageInstallation());const ios=/iPad|iPhone|iPod/i.test(navigator.userAgent||'');location.href='sms:'+numero+(ios?'&body=':'?body=')+body;}
function ouvrirPartage(){
  let o=null;try{if(typeof window.cdqV19CreateModal==='function')o=window.cdqV19CreateModal('cdqShareAppModal','📲 Installer / partager Balance CDQ','');}catch(e){}
  if(!o){o=document.getElementById('cdqShareAppModal');if(!o){o=document.createElement('div');o.id='cdqShareAppModal';o.className='modal-overlay';o.innerHTML='<div class="modal"><h2>📲 Installer / partager Balance CDQ</h2><div class="cdq-v19-body"></div><div class="modal-buttons"><button type="button" class="modal-button cancel-button">Fermer</button></div></div>';o.querySelector('.cancel-button').onclick=function(){o.style.display='none';};document.body.appendChild(o);}}
  const body=o.querySelector('.cdq-v19-body')||o.querySelector('.cdq-modal-body');if(!body)return;
  body.innerHTML=`<div style="display:grid;gap:12px"><div style="padding:12px;border:1px solid #31516a;border-radius:12px;background:#0b1f30"><strong>Lien officiel d’installation</strong><div style="margin-top:7px;font-size:12px;color:#9fb6c9;overflow-wrap:anywhere">${CDQ_INSTALL_URL_PUBLIC}</div></div><button type="button" id="cdqShareNative" class="modal-button" style="min-height:52px">📤 Choisir Messenger, Messages, courriel…</button><label style="display:grid;gap:5px;font-weight:800;font-size:13px">Adresse courriel (optionnel)<input id="cdqShareEmail" type="email" autocomplete="email" placeholder="technicien@exemple.com" style="min-height:46px;border:1px solid #35536b;border-radius:10px;background:#0d2233;color:#fff;padding:0 10px"></label><button type="button" id="cdqShareEmailButton" class="modal-button" style="min-height:48px">✉️ Envoyer par courriel</button><label style="display:grid;gap:5px;font-weight:800;font-size:13px">Numéro de téléphone (optionnel)<input id="cdqSharePhone" type="tel" autocomplete="tel" inputmode="tel" placeholder="819 555-1234" style="min-height:46px;border:1px solid #35536b;border-radius:10px;background:#0d2233;color:#fff;padding:0 10px"></label><button type="button" id="cdqShareSmsButton" class="modal-button" style="min-height:48px">💬 Envoyer par message texte</button><button type="button" id="cdqCopyInstallLink" class="modal-button" style="min-height:48px">📋 Copier le lien</button><button type="button" id="cdqOpenInstallPage" class="modal-button" style="min-height:48px">🌐 Ouvrir la page d’installation</button><div style="font-size:11.5px;color:#8fa7bb;line-height:1.4">Le bouton Partager ouvre le menu natif du téléphone : Messenger, Messages, Mail et les autres applications disponibles peuvent y apparaître selon l’appareil.</div></div>`;
  body.querySelector('#cdqShareNative').onclick=partagerLien;body.querySelector('#cdqShareEmailButton').onclick=function(){envoyerCourriel(body.querySelector('#cdqShareEmail').value);};body.querySelector('#cdqShareSmsButton').onclick=function(){envoyerSms(body.querySelector('#cdqSharePhone').value);};body.querySelector('#cdqCopyInstallLink').onclick=copierLien;body.querySelector('#cdqOpenInstallPage').onclick=function(){window.open(CDQ_INSTALL_URL_PUBLIC,'_blank','noopener');};o.style.display='flex';const modal=o.querySelector('.modal');if(modal){try{modal.scrollTop=0;}catch(e){}}
}
function ajouterDansAffichage(){const m=document.getElementById('cdqDisplayModal');if(!m)return;const options=m.querySelector('.cdq-display-options');if(!options||options.querySelector('[data-cdq-install-share="1"]'))return;const g=document.createElement('div');g.className='cdq-display-group';g.setAttribute('data-cdq-install-share','1');g.innerHTML='<div class="cdq-display-label">Application</div><button id="cdqInstallShareSettingsButton" type="button" class="cdq-admin-settings-button"><span>📲</span><span><strong>Installer / partager Balance CDQ</strong><small>Messenger, Messages, courriel, SMS ou copier le lien</small></span></button>';options.appendChild(g);g.querySelector('#cdqInstallShareSettingsButton').onclick=ouvrirPartage;}
function installer(){const display=document.getElementById('displayModeButton');if(display&&!display.dataset.cdqV2156){display.dataset.cdqV2156='1';const old=display.onclick;display.onclick=function(e){if(typeof old==='function')old.call(this,e);else if(typeof window.ouvrirReglagesAffichage==='function')window.ouvrirReglagesAffichage();setTimeout(ajouterDansAffichage,0);};}const m=document.getElementById('cdqDisplayModal');if(m&&!m.dataset.cdqV2156Observer){m.dataset.cdqV2156Observer='1';const target=m.querySelector('.cdq-modal-body')||m;new MutationObserver(function(){ajouterDansAffichage();}).observe(target,{childList:true,subtree:false});}ajouterDansAffichage();}
window.cdqOuvrirPartageApplication=ouvrirPartage;if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(installer,250);},{once:true});else setTimeout(installer,250);window.addEventListener('load',function(){setTimeout(installer,350);});
})();
