name: Validate private signature and stage word-safe 25.34 release
on:
  push:
    branches: [codex/whole-words-v2534]
    paths: ['balance-cdq-android/signing/approval-v2534.json','.github/workflows/publish-whole-words-v2534.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: stage-words2534
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/whole-words-v2534
          fetch-depth: 0
      - name: Check whether a public signing approval has been supplied
        id: ready
        run: |
          if test -f balance-cdq-android/signing/approval-v2534.json; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Bind signed source and successful build/test run
        if: steps.ready.outputs.ready == 'true'
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess,os,urllib.request
          a=json.load(open('balance-cdq-android/signing/approval-v2534.json'))
          assert isinstance(a['runId'],int) and a['runId']>0
          assert a['artifactName']=='CDQ-Words2534-unsigned'
          changed=set(subprocess.check_output(['git','diff','--name-only',a['sourceCommit'],'HEAD'],text=True).splitlines())
          allowed={'balance-cdq-android/signing/approval-v2534.json','.github/workflows/build-balance-cdq-android.yml','.github/workflows/publish-whole-words-v2534.yml','.github/workflows/words-published-v2534.yml','scripts/stage-words-release-v2534.py','tests/published-words-v2534.mjs'}
          assert changed<=allowed,repr(changed-allowed)
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+str(a['runId'])
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as r:run=json.load(r)
          assert run['head_sha']==a['sourceCommit'] and run['conclusion']=='success','Both native and browser tests must pass for this exact source'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('run='+str(a['runId'])+'\n')
          PY
      - uses: actions/download-artifact@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          name: CDQ-Words2534-unsigned
          run-id: ${{ steps.approval.outputs.run }}
          github-token: ${{ github.token }}
          path: /tmp/cdq-handoff
      - name: Attach approved public signature; no private signing material in CI
        if: steps.ready.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json,base64,zlib,hashlib
          from pathlib import Path
          a=json.loads(Path('balance-cdq-android/signing/approval-v2534.json').read_text())
          assert a['signingBlockBytes']==8192
          decoder=zlib.decompressobj(31)
          block=decoder.decompress(base64.b64decode(a['signingBlockGzipBase64'],validate=True),65536)
          assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          assert len(block)==a['signingBlockBytes'] and hashlib.sha256(block).hexdigest()==a['signingBlockSha256']
          a['signingBlockBase64']=base64.b64encode(block).decode()
          Path('/tmp/cdq-public-approval.json').write_text(json.dumps(a))
          PY
          python3 balance-cdq-android/signing/detached-apk-v2.py attach --apk /tmp/cdq-handoff/unsigned.apk --request /tmp/cdq-handoff/request.json --approval /tmp/cdq-public-approval.json --output downloads/Balance-CDQ-Android-25.34.apk
      - name: Install official SDK verifier
        if: steps.ready.outputs.ready == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Verify signature, pinned certificate, alignment and package identity
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          APK=downloads/Balance-CDQ-Android-25.34.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cdq-signature.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: 496030d9cd10e81ff4e9486c38491bc15389112c0c295c61c295981c101c4436' /tmp/cdq-signature.txt
          "$TOOLS/zipalign" -c -P 16 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" > /tmp/cdq-package.txt
          grep -q "package: name='ca.balancecdq.android' versionCode='2534' versionName='25.34'" /tmp/cdq-package.txt
          ! grep -q application-debuggable /tmp/cdq-package.txt
      - name: Regenerate paired iPhone and verify protected assets and calibration
        if: steps.ready.outputs.ready == 'true'
        run: |
          node scripts/build-embedded-android-v2528.mjs
          node scripts/build-iphone.mjs
          python3 scripts/stage-words-release-v2534.py
          python3 balance-cdq-android/signing/verify-published-release.py --tools "$ANDROID_HOME/build-tools/35.0.0"
          node tests/iphone-install.test.mjs
          node --test tests/personal-sizing-v2533.test.mjs tests/release-references.test.mjs
      - name: Commit release paths to isolated branch only
        if: steps.ready.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          for line in changed:
              p=line[3:]
              assert p.startswith('iphone/app/') or p in {'iphone/index.html','installer.html','downloads/Balance-CDQ-Android-25.34.apk','downloads/Balance-CDQ-Android-25.34.zip','downloads/android-release-update.json','.github/workflows/build-balance-cdq-android.yml'},p
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iphone/app iphone/index.html installer.html downloads/Balance-CDQ-Android-25.34.apk downloads/android-release-update.json .github/workflows/build-balance-cdq-android.yml
          git add -f downloads/Balance-CDQ-Android-25.34.zip
          git commit -m 'Stage certified 25.34 Android release and paired whole-word iPhone interface'
          git push origin HEAD:codex/whole-words-v2534
