name: Test Apps Script Manager

on:
  push:
    paths:
      - 'apps-script-manager/**'
      - 'tests/test-apps-script-manager.mjs'
      - 'tests/script-manager-network-v41.test.mjs'
      - 'tests/script-manager-patches-v42.test.mjs'
      - 'tests/script-manager-diagnostics-v43.test.mjs'
      - 'tests/test-script-manager-diagnostics-v43.py'
      - '.github/workflows/test-apps-script-manager.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find Chrome
        id: chrome
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then echo "path=$(command -v google-chrome)" >> "$GITHUB_OUTPUT";
          elif command -v google-chrome-stable >/dev/null; then echo "path=$(command -v google-chrome-stable)" >> "$GITHUB_OUTPUT";
          elif command -v chromium >/dev/null; then echo "path=$(command -v chromium)" >> "$GITHUB_OUTPUT";
          else echo 'Chrome/Chromium not found'; exit 1; fi
      - name: Verify deadlines, write recovery, patches and private diagnostic
        run: |
          node --check apps-script-manager/app.js
          node --check apps-script-manager/api.js
          node --check apps-script-manager/diagnostics.js
          node --test tests/script-manager-network-v41.test.mjs tests/script-manager-patches-v42.test.mjs tests/script-manager-diagnostics-v43.test.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save puppeteer-core@24
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps webkit
      - name: Run existing Chrome validation
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: node tests/test-apps-script-manager.mjs
      - name: Verify private diagnostic in Chromium and WebKit
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          CDQ_TEST_WEBKIT: '1'
        run: python tests/test-script-manager-diagnostics-v43.py
