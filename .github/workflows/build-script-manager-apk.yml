name: Build CDQ Script Manager APK

on:
  push:
    branches: [main]
    paths:
      - 'script-manager-android/**'
      - 'apps-script-manager/icon-512.png'
      - '.github/workflows/build-script-manager-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Android icon
        run: |
          mkdir -p script-manager-android/app/src/main/res/drawable-nodpi
          cp apps-script-manager/icon-512.png script-manager-android/app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Build debug APK
        working-directory: script-manager-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp script-manager-android/app/build/outputs/apk/debug/app-debug.apk dist/CDQ-Script-Manager.apk
          ls -lh dist/CDQ-Script-Manager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CDQ-Script-Manager-APK
          path: dist/CDQ-Script-Manager.apk
          if-no-files-found: error
          retention-days: 30
