name: Calculs Atelier 1.3 dependencies
on:
  push:
    branches: [calculs-atelier-v1-3-tools]
    paths: [.github/workflows/calculs-atelier-v1-3-tools.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Public npm dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir deps && cd deps
          cat > package.json <<'JSON'
          {"name":"calculs-atelier-autonome","version":"1.3.0","private":true,"type":"module","dependencies":{"@tailwindcss/postcss":"4.1.18","@types/node":"22.19.19","@types/react":"19.2.0","@types/react-dom":"19.2.0","@vitejs/plugin-react":"4.3.4","class-variance-authority":"0.7.1","clsx":"2.1.1","fake-indexeddb":"6.2.4","lucide-react":"0.468.0","radix-ui":"1.4.3","react":"19.2.0","react-dom":"19.2.0","tailwind-merge":"3.3.1","tailwindcss":"4.1.18","tw-animate-css":"1.4.0","typescript":"5.9.3","vite":"6.1.0"}}
          JSON
          npm install --ignore-scripts --no-audit --no-fund
          tar -czf ../atelier-npm-deps.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-1-3-public-dependencies
          path: atelier-npm-deps.tgz
          retention-days: 1
          compression-level: 0
