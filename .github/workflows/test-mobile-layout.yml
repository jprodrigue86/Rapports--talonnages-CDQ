name: Mobile layout components
on:
  pull_request:
  push:
    paths:
      - 'bundles/balance-cdq/v25.11/**'
      - 'tests/mobile-layout.test.mjs'
      - '.github/workflows/test-mobile-layout.yml'
jobs:
  phone-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save puppeteer-core@24
      - run: node tests/mobile-layout.test.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mobile-settings-component-screenshots
          path: /tmp/cdq-settings-*.png
