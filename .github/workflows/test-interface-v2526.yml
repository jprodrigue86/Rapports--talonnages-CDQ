name: Sheets offline and return V25.26
on:
  push:
    paths: ['*v2526*', 'index.html', 'pc/**', 'sw.js', 'bundles/balance-cdq/v25.26/**', 'tests/*v2526*', 'scripts/*v2526*', '.github/workflows/test-interface-v2526.yml']
  pull_request:
    paths: ['*v2526*', 'index.html', 'pc/**', 'sw.js', 'bundles/balance-cdq/v25.26/**', 'tests/*v2526*', 'scripts/*v2526*', '.github/workflows/test-interface-v2526.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-interface-v2526.mjs && git diff --exit-code
      - run: node --test tests/offline-documents-v2526.test.mjs tests/sheet-launcher-v2526.test.mjs
      - run: npm install --no-save puppeteer-core@24
      - run: node tests/offline-v2526-browser.test.mjs
      - run: node tests/startup-v2525-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V25.26-verification
          path: /tmp/cdq-v2526-*
          if-no-files-found: ignore
          retention-days: 2
