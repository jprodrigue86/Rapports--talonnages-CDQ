name: Embedded Android interface

on:
  push:
    paths:
      - 'balance-cdq-android/web-source/**'
      - 'scripts/build-embedded-android-v2528.mjs'
      - 'scripts/*instant-files*.mjs'
      - 'scripts/*sizing*.mjs'
      - 'scripts/*safe-area*.mjs'
      - 'scripts/*whole-words*.mjs'
      - 'scripts/*full-names*.mjs'
      - 'full-names-v2536.js'
      - 'whole-words-v2534.js'
      - 'personal-sizing-v2533.js'
      - 'safe-viewport-v2532.js'
      - 'bundles/balance-cdq/v25.28/**'
      - 'tests/embedded-v2528*'
      - 'tests/full-names-v2536*'
      - 'fast-start-v2537.js'
      - 'scripts/fast-start-v2537.mjs'
      - 'tests/fast-start-v2537*'
      - '.github/workflows/test-embedded-v2528.yml'
  pull_request:
    branches: [main]
    paths:
      - 'balance-cdq-android/web-source/**'
      - 'scripts/build-embedded-android-v2528.mjs'
      - 'scripts/*instant-files*.mjs'
      - 'scripts/*sizing*.mjs'
      - 'scripts/*safe-area*.mjs'
      - 'scripts/*whole-words*.mjs'
      - 'scripts/*full-names*.mjs'
      - 'full-names-v2536.js'
      - 'whole-words-v2534.js'
      - 'personal-sizing-v2533.js'
      - 'safe-viewport-v2532.js'
      - 'bundles/balance-cdq/v25.28/**'
      - 'tests/embedded-v2528*'
      - 'tests/full-names-v2536*'
      - 'fast-start-v2537.js'
      - 'scripts/fast-start-v2537.mjs'
      - 'tests/fast-start-v2537*'
      - '.github/workflows/test-embedded-v2528.yml'

permissions:
  contents: read

concurrency:
  group: embedded-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build embedded Android interface and server package
        run: |
          node scripts/build-embedded-android-v2528.mjs
          node scripts/build-embedded-package-v2528.mjs
          git diff --exit-code -- bundles/balance-cdq/v25.28

      - name: Run source and package regressions
        run: |
          node --test tests/embedded-v2528.test.mjs tests/embedded-startup-v2529.test.mjs tests/performance-v2527.test.mjs tests/full-names-v2536.test.mjs tests/fast-start-v2537.test.mjs

      - name: Install Chromium
        run: npm install --no-save --package-lock=false puppeteer-core@24

      - name: Run installed-interface browser verification
        run: node tests/embedded-v2528-browser.test.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-android-preview
          path: /tmp/cdq-v2528-*.png
          if-no-files-found: ignore
          retention-days: 2
