name: Drive, favorites and interface V25.21
on:
  push:
    paths: ['bundles/balance-cdq/v25.21/**', 'assets/music-wall-*-v2521.webp', 'scripts/build-interface-v2521.mjs', 'tests/*v2521*', '.github/workflows/test-interface-v2521.yml']
  pull_request:
    paths: ['bundles/balance-cdq/v25.21/**', 'assets/music-wall-*-v2521.webp', 'scripts/build-interface-v2521.mjs', 'tests/*v2521*', '.github/workflows/test-interface-v2521.yml']
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-interface-v2521.mjs && git diff --exit-code
      - run: node --test tests/interface-v2521.test.mjs tests/pdf-reader-server.test.mjs tests/pdf-reader-package.test.mjs tests/reader-interactions.test.mjs
      - run: npm install --no-save puppeteer-core@24
      - run: node tests/interface-v2521-browser.test.mjs
      - run: node tests/floor-scope-v2521-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Interface-V25.21-browser-checks
          path: /tmp/cdq-v2521-*.png
          if-no-files-found: ignore
          retention-days: 7
