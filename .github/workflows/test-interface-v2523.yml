name: PDF and migration V25.23
on:
  push:
    paths: ['*v2523*', 'vendor/pdf-lib*', 'bundles/balance-cdq/v25.23/**', 'tests/*v2523*', 'scripts/*v2523*', '.github/workflows/test-interface-v2523.yml']
  pull_request:
    paths: ['*v2523*', 'vendor/pdf-lib*', 'bundles/balance-cdq/v25.23/**', 'tests/*v2523*', 'scripts/*v2523*', '.github/workflows/test-interface-v2523.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-interface-v2523.mjs && git diff --exit-code
      - run: node --test tests/migration-v2523.test.mjs tests/reader-v2523.test.mjs tests/offline-controller.test.mjs tests/offline-templates.test.mjs
      - run: npm install --no-save puppeteer-core@24
      - run: node tests/pdf-fill-v2523-browser.test.mjs
      - run: node tests/interface-v2523-browser.test.mjs
      - run: node tests/pdf-reader-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V25.23-verification
          path: /tmp/cdq-v2523-*
          if-no-files-found: ignore
          retention-days: 3
