name: Build Balance CDQ Android APK

on:
  push:
    branches: [main]
    paths:
      - 'balance-cdq-android/**'
      - '.github/workflows/build-balance-cdq-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preserve Balance CDQ debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: balance-cdq-android-debug-keystore-v1

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: balance-cdq-android
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          APK='balance-cdq-android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/balance-cdq-badging.txt
          grep -q "package: name='ca.balancecdq.android'" /tmp/balance-cdq-badging.txt

      - name: Publish APK + update channel
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p downloads
          APK_SRC='balance-cdq-android/app/build/outputs/apk/debug/app-debug.apk'
          APK_DST='downloads/Balance-CDQ-Android.apk'
          UPDATE_JSON='downloads/android-update.json'

          cp "$APK_SRC" "$APK_DST"

          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' balance-cdq-android/app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' balance-cdq-android/app/build.gradle.kts | head -1)
          APK_SHA256=$(sha256sum "$APK_DST" | awk '{print $1}')

          cat > "$UPDATE_JSON" <<JSON
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "apkUrl": "https://jprodrigue86.github.io/Rapports--talonnages-CDQ/downloads/Balance-CDQ-Android.apk",
            "sha256": "$APK_SHA256",
            "mandatory": false,
            "channel": "stable"
          }
          JSON

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$APK_DST" "$UPDATE_JSON"

          if git diff --cached --quiet; then
            echo "APK and Android update manifest unchanged"
            exit 0
          fi

          git commit -m "Publish Balance CDQ Android $VERSION_NAME + update channel [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
