name: Build Balance CDQ Android APK

on:
  push:
    branches: [main]
    paths:
      - 'balance-cdq-android/**'
      - '.github/workflows/build-balance-cdq-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: balance-cdq-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preserve Balance CDQ debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: balance-cdq-android-debug-keystore-v1

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: balance-cdq-android
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          APK='balance-cdq-android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/balance-cdq-badging.txt
          grep -q "package: name='ca.balancecdq.android'" /tmp/balance-cdq-badging.txt

      - name: Validate native shell + icon
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:icon="@drawable/ic_balance_cdq"' balance-cdq-android/app/src/main/AndroidManifest.xml
          grep -q 'WebView' balance-cdq-android/app/src/main/java/ca/balancecdq/android/MainActivity.kt
          grep -q 'BeginSignInRequest' balance-cdq-android/app/src/main/java/ca/balancecdq/android/MainActivity.kt
          ! grep -q 'CustomTabsIntent' balance-cdq-android/app/src/main/java/ca/balancecdq/android/MainActivity.kt
          unzip -l "$APK" | grep -q 'res/drawable/ic_balance_cdq.png'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Balance-CDQ-Android-25.00
          path: balance-cdq-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK + update channel
        shell: bash
        run: |
          set -euo pipefail

          APK_SRC='balance-cdq-android/app/build/outputs/apk/debug/app-debug.apk'
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' balance-cdq-android/app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' balance-cdq-android/app/build.gradle.kts | head -1)

          cp "$APK_SRC" /tmp/Balance-CDQ-Android.apk
          APK_SHA256=$(sha256sum /tmp/Balance-CDQ-Android.apk | awk '{print $1}')

          cat > /tmp/android-update.json <<JSON
          {
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "apkUrl": "https://raw.githubusercontent.com/jprodrigue86/Rapports--talonnages-CDQ/main/downloads/Balance-CDQ-Android.apk",
            "sha256": "$APK_SHA256",
            "mandatory": false,
            "channel": "stable"
          }
          JSON

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Repartir du main le plus récent APRÈS le build afin d'éviter les
          # conflits lorsque d'autres corrections ont été publiées pendant la compilation.
          git fetch origin main
          git reset --hard origin/main

          mkdir -p downloads
          cp /tmp/Balance-CDQ-Android.apk downloads/Balance-CDQ-Android.apk
          cp /tmp/android-update.json downloads/android-update.json

          git add downloads/Balance-CDQ-Android.apk downloads/android-update.json

          if git diff --cached --quiet; then
            echo "APK and Android update manifest unchanged"
            exit 0
          fi

          git commit -m "Publish Balance CDQ Android $VERSION_NAME + update channel [skip ci]"
          git push origin HEAD:main
