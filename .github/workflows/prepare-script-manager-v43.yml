# Only the isolated feature branch is written; no Google project or release is deployed.
name: Prepare and validate Script Manager V43
on:
  push:
    branches: ['codex/script-manager-v43-audit']
    paths:
      - 'scripts/prepare-script-manager-v43.py'
      - 'apps-script-manager/diagnostics.*'
      - 'tests/script-manager-diagnostics-v43.test.mjs'
      - 'tests/test-script-manager-diagnostics-v43.py'
      - '.github/workflows/prepare-script-manager-v43.yml'
permissions:
  contents: write
concurrency:
  group: prepare-script-manager-v43
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/script-manager-v43-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate guarded V43 changes
        run: python scripts/prepare-script-manager-v43.py
      - name: Unit and regression checks
        run: |
          node --check apps-script-manager/app.js
          node --check apps-script-manager/api.js
          node --check apps-script-manager/diagnostics.js
          node --test tests/script-manager-network-v41.test.mjs tests/script-manager-patches-v42.test.mjs tests/script-manager-diagnostics-v43.test.mjs
      - name: Browser test dependencies
        run: |
          npm install --no-save puppeteer-core@24
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps webkit
      - name: Existing Script Manager regression suite
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/test-apps-script-manager.mjs
      - name: Chromium and WebKit private diagnostic tests
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CDQ_TEST_WEBKIT: '1'
          CDQ_TEST_SCREENSHOT: /tmp/cdq-v43-diagnostic.png
        run: python tests/test-script-manager-diagnostics-v43.py
      - name: Commit only the validated Manager integration
        run: |
          git config user.name 'CDQ validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script-manager/diagnostics.js apps-script-manager/app.js apps-script-manager/api.js apps-script-manager/index.html apps-script-manager/sw.js apps-script-manager/version.json
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate verified Script Manager V43 private version diagnostic'
            git push origin HEAD:codex/script-manager-v43-audit
          fi
          git rev-parse HEAD
      - name: Keep the small UI test preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-manager-v43-ui-preview
          path: /tmp/cdq-v43-diagnostic.png
          if-no-files-found: ignore
          retention-days: 2
