name: Calculs Atelier 1.2 build dependencies
on:
  push:
    branches: [calculs-atelier-v1-2-build]
    paths: [.github/workflows/calculs-atelier-v1-2-deps.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir deps && cd deps
          npm init -y >/dev/null
          npm install --save-exact react@19.2.0 react-dom@19.2.0 lucide-react@0.468.0 radix-ui@1.4.3 class-variance-authority@0.7.1 clsx@2.1.1 tailwind-merge@3.3.1 vite@6.1.0 @vitejs/plugin-react@4.3.4 @tailwindcss/postcss@4.1.18 tailwindcss@4.1.18 tw-animate-css@1.4.0 typescript@5.9.3 @types/react@19.2.0 @types/react-dom@19.2.0 @types/node@22.19.19 fake-indexeddb@6.2.4
          tar -czf ../calculs-atelier-v1-2-deps.tgz package.json package-lock.json node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: calculs-atelier-v1-2-deps
          path: calculs-atelier-v1-2-deps.tgz
          retention-days: 1
          compression-level: 0
