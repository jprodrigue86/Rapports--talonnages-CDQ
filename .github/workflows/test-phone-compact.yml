name: Compact phone and reverse swipe
on:
  push:
    paths:
      - 'bundles/balance-cdq/v25.13/**'
      - 'tests/phone-compact*'
      - 'tests/fixtures/legacy-phone-swipes.js'
      - 'scripts/build-phone-compact.mjs'
      - '.github/workflows/test-phone-compact.yml'
  pull_request:
    paths:
      - 'bundles/balance-cdq/v25.13/**'
      - 'tests/phone-compact*'
      - 'tests/fixtures/legacy-phone-swipes.js'
      - 'scripts/build-phone-compact.mjs'
      - '.github/workflows/test-phone-compact.yml'
jobs:
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-phone-compact.mjs && git diff --exit-code
      - run: node --test tests/phone-compact-package.test.mjs
      - run: npm install --no-save puppeteer-core@24
      - run: node tests/phone-compact.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Compact-phone-previews
          path: /tmp/cdq-compact-*
          retention-days: 7
