name: Calculs Atelier 1.4 signed publication
on:
  push:
    branches: [calculs-atelier-v1-4-publication]
    paths: [.github/workflows/calculs-atelier-publish-v1-4.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Download verified compiled update only
        env:
          SOURCE_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-5440-8211-ad01-6763362c8294/raw?se=2026-09-24T11%3A22%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=09e22aae-a8b6-5819-a89d-2796a75f61d0&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T09%3A43%3A08Z&ske=2026-09-25T09%3A43%3A08Z&sks=b&skv=2026-02-06&sig=eukSaWN4UEfzEeIYFK6m5wh%2BY7xfybWK8MBgU851qJI%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 "$SOURCE_URL" -o signed-update.json
          echo 'fdfa7a0adc5975ee4cec18d11d30eb3d31dfb4a5d56d479a2f4da2d795f268ec  signed-update.json' | sha256sum -c -
      - name: Verify signature then publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, time, urllib.request, urllib.error
          raw = pathlib.Path('signed-update.json').read_bytes()
          expected = 'fdfa7a0adc5975ee4cec18d11d30eb3d31dfb4a5d56d479a2f4da2d795f268ec'
          assert len(raw) == 1174053 and hashlib.sha256(raw).hexdigest() == expected
          envelope = json.loads(raw)
          payload = base64.b64decode(envelope['payload'], validate=True)
          signature = base64.b64decode(envelope['signature'], validate=True)
          public = ''
          pathlib.Path('public.der').write_bytes(base64.b64decode(public))
          pathlib.Path('payload.bin').write_bytes(payload)
          pathlib.Path('signature.bin').write_bytes(signature)
          subprocess.run(['openssl','pkey','-pubin','-inform','DER','-in','public.der','-out','public.pem'], check=True)
          subprocess.run(['openssl','dgst','-sha256','-verify','public.pem','-signature','signature.bin','payload.bin'], check=True)
          p = json.loads(payload)
          assert p['appId'] == 'com.atelier.calculs' and p['schema'] == 1
          assert p['version'] == '1.4.0' and p['versionCode'] == 14000 and p['minShellVersion'] == 11000
          html = base64.b64decode(p['html'], validate=True)
          assert len(html) == 659526 and hashlib.sha256(html).hexdigest() == p['sha256'] == '9fa00f281a95d1ec315d26c7cdc647a63b67efe68c7f0209c7fc543bf822a1b5'
          assert b'sign-toggle' in html and b'Mapxr' in html and b'1.4.0' in html
          repo = 'jprodrigue86/Rapports--talonnages-CDQ'
          api = 'https://api.github.com/repos/' + repo
          headers = {'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28','User-Agent':'Calculs-Atelier-Publication'}
          def call(path, method='GET', data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(api + path, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          blob = call('/git/blobs','POST',{'content':raw.decode(), 'encoding':'utf-8'})['sha']
          assert blob == '95339e3321f2e457093b29eb6be9c3adbe3fdc7c'
          info = {'app':'Calculs d’atelier','version':p['version'],'versionCode':p['versionCode'],'minShellVersion':p['minShellVersion'],'releasedAt':p['releasedAt'],'channel':'latest.atelier-update.json','packageSha256':expected,'htmlSha256':p['sha256'],'packageBytes':len(raw),'htmlBytes':len(html),'notes':p['notes'],'materials':{'pcs':['Bag','Box'],'m':['NW','SAP','VR','Film','RP'],'kg':['ADH','Lotion']},'machines':['V1','V2','L7','L8','L9','L10'],'verification':{'signature':'RSA-SHA256 validée avec la clé historique','calculationAndStorageGroups':35,'arithmeticCombinations':10000,'skuAndPlanningGroups':26,'materialsAndSignedInputGroups':41,'materialArithmeticCombinations':8000,'chromiumRegressionGroups':36,'chromiumMaterialsGroups':18,'updaterGroups':24,'physicalDeviceTest':False,'browserStorage':'fake-indexeddb; tests de navigateur avec stockage simulé'},'privacy':'Contenu applicatif compilé et référentiel embarqué uniquement. Aucune saisie utilisateur, aucun historique local, aucune clé privée.'}
          info_raw = json.dumps(info, ensure_ascii=False, indent=2) + '\n'
          info_blob = call('/git/blobs','POST',{'content':info_raw,'encoding':'utf-8'})['sha']
          folder = 'downloads/calculs-atelier/'
          old = '45dfb6a4873879fb3ece2ed04befc3a1703eb935'
          for attempt in range(3):
              head = call('/git/ref/heads/main')['object']['sha']
              current = call('/contents/' + folder + 'latest.atelier-update.json?ref=' + head)['sha']
              assert current in (old,blob), 'Another application release exists; publication stopped.'
              commit = call('/git/commits/' + head)
              tree = call('/git/trees','POST',{'base_tree':commit['tree']['sha'],'tree':[
                  {'path':folder + name,'mode':'100644','type':'blob','sha':blob}
                  for name in ['latest.atelier-update.json','android-update.json','versions/1.4.0.atelier-update.json']
              ] + [{'path':folder+'release-info.json','mode':'100644','type':'blob','sha':info_blob}]})['sha']
              new = call('/git/commits','POST',{'message':'Calculs atelier 1.4 : neuf matières, unités cohérentes, solde Mapxr et bouton signe ±','tree':tree,'parents':[head]})['sha']
              try:
                  call('/git/refs/heads/main','PATCH',{'sha':new,'force':False})
                  break
              except urllib.error.HTTPError as e:
                  if e.code not in (409,422) or attempt == 2: raise
                  time.sleep(2)
          for name in ['latest.atelier-update.json','android-update.json','versions/1.4.0.atelier-update.json']:
              assert call('/contents/' + folder + name + '?ref=' + new)['sha'] == blob
          for name in ['latest.atelier-update.json','android-update.json']:
              url = 'https://raw.githubusercontent.com/' + repo + '/main/' + folder + name + '?release=' + new
              req = urllib.request.Request(url, headers={'Cache-Control':'no-cache','Origin':'https://appassets.androidplatform.net'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  downloaded = r.read()
                  cors = r.headers.get('Access-Control-Allow-Origin')
              assert downloaded == raw and cors == '*'
          status = {'published':True,'version':'1.4.0','commit':new,'blob':blob,'sha256':expected,'publicRawVerified':True,'cors':'*','htmlBytes':len(html),'physicalDeviceTest':False}
          pathlib.Path('publication-status.json').write_text(json.dumps(status, indent=2))
          print(json.dumps(status, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-1-4-publication-status
          path: publication-status.json
          retention-days: 1
