name: Verify published whole-word Android and iPhone 25.34
on:
  push:
    branches: [main]
    paths: ['downloads/Balance-CDQ-Android-25.34.apk','downloads/android-release-update.json','iphone/app/release.json','tests/published-words-v2534.mjs','.github/workflows/words-published-v2534.yml']
permissions:
  contents: read
concurrency:
  group: words-published2534
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare real publication APK, ZIP, iPhone and share pages
        run: node tests/published-words-v2534.mjs
      - name: Install browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 >/tmp/browsers.log 2>&1 || { tail -40 /tmp/browsers.log; exit 1; }
          npx playwright install --with-deps chromium webkit >>/tmp/browsers.log 2>&1 || { tail -40 /tmp/browsers.log; exit 1; }
      - name: Verify anonymous iPhone startup against real Google with published files
        env:
          CDQ_TEST_PUBLISHED: '1'
        run: node tests/iphone-rpc-live.test.mjs
