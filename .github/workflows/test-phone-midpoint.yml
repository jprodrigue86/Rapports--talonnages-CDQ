name: Phone midpoint layout
on:
  push:
    paths:
      - 'bundles/balance-cdq/v25.12/**'
      - 'tests/phone-midpoint*'
      - 'tests/helpers/phone-midpoint-fixture.mjs'
      - 'tests/fixtures/phone-v2511.css'
      - '.github/workflows/test-phone-midpoint.yml'
  pull_request:
    paths:
      - 'bundles/balance-cdq/v25.12/**'
      - 'tests/phone-midpoint*'
      - 'tests/helpers/phone-midpoint-fixture.mjs'
      - 'tests/fixtures/phone-v2511.css'
      - '.github/workflows/test-phone-midpoint.yml'
jobs:
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/phone-midpoint-package.test.mjs
      - run: npm install --no-save puppeteer-core@24
      - run: node tests/phone-midpoint.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Phone-midpoint-previews
          path: /tmp/cdq-phone-*
