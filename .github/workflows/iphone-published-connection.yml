name: Verify published iPhone connection
on:
  push:
    branches: [main]
    paths:
      - 'iphone/app/embedded-rpc.js'
      - 'iphone/app/release.json'
      - 'iphone/app/connection-repair.html'
      - 'tests/iphone-rpc-live.test.mjs'
      - '.github/workflows/iphone-published-connection.yml'
permissions:
  contents: read
concurrency:
  group: iphone-published-connection
  cancel-in-progress: true
jobs:
  published-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 >/tmp/browsers.log 2>&1 || { tail -40 /tmp/browsers.log; exit 1; }
          npx playwright install --with-deps chromium webkit >>/tmp/browsers.log 2>&1 || { tail -40 /tmp/browsers.log; exit 1; }
      - name: Wait for the expected public release and compare file checksums
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const base='https://jprodrigue86.github.io/Rapports--talonnages-CDQ/iphone/app/';
          const expected=JSON.parse(fs.readFileSync('iphone/app/release.json','utf8'));
          const deadline=Date.now()+240000;let ready=false;
          while(Date.now()<deadline){
            try{
              const response=await fetch(base+'release.json?verify='+Date.now(),{signal:AbortSignal.timeout(10000)});
              if(response.ok&&(await response.json()).release===expected.release){ready=true;break;}
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert.ok(ready,'Pages did not yet publish the expected iPhone release');
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          for(const name of ['embedded-rpc.js','connection-repair.html','index.html','sw.js']){
            const response=await fetch(base+name+'?verify='+Date.now(),{signal:AbortSignal.timeout(15000)});
            assert.ok(response.ok,name+' published');
            assert.equal(hash(Buffer.from(await response.arrayBuffer())),hash(fs.readFileSync('iphone/app/'+name)),name+' publication checksum');
          }
          console.log(JSON.stringify({publishedRelease:expected.release,connectionRevision:expected.connectionRevision,checksums:'verified'}));
          JS
      - name: Test public app with real Google, not mocked static files or server
        env:
          CDQ_TEST_PUBLISHED: '1'
        run: node tests/iphone-rpc-live.test.mjs
