name: Verify published Balance CDQ 25.35

on:
  push:
    branches: [main]
    paths:
      - 'downloads/Balance-CDQ-Android-25.35.apk'
      - 'downloads/android-release-update.json'
      - 'iphone/app/release.json'
      - 'tests/published-point50-v2535.mjs'
      - '.github/workflows/published-point50-v2535.yml'

permissions:
  contents: read

concurrency:
  group: published-point50-2535
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare the real GitHub Pages publication byte for byte
        run: node tests/published-point50-v2535.mjs
      - name: Install browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 >/tmp/browsers.log 2>&1 || { tail -40 /tmp/browsers.log; exit 1; }
          npx playwright install --with-deps chromium webkit >>/tmp/browsers.log 2>&1 || { tail -40 /tmp/browsers.log; exit 1; }
      - name: Verify anonymous iPhone startup against the real Google relay
        env:
          CDQ_TEST_PUBLISHED: '1'
        run: node tests/iphone-rpc-live.test.mjs
