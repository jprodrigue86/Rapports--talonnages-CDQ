name: Build Balance CDQ PDF Bridge APK

on:
  push:
    branches: [main]
    paths:
      - 'balance-cdq-pdf-bridge/**'
      - '.github/workflows/build-balance-cdq-pdf-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: balance-cdq-pdf-bridge
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          APK='balance-cdq-pdf-bridge/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ca.balancecdq.pdfbridge'" /tmp/badging.txt

      - name: Publish APK into GitHub Pages
        shell: bash
        run: |
          mkdir -p downloads
          cp balance-cdq-pdf-bridge/app/build/outputs/apk/debug/app-debug.apk downloads/Balance-CDQ-PDF-Bridge.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Balance-CDQ-PDF-Bridge.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "Publish Balance CDQ PDF Bridge APK [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
