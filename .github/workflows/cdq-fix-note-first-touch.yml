name: CDQ patch Selector note save

on:
  push:
    paths:
      - '.github/workflows/cdq-fix-note-first-touch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Selector
        shell: bash
        run: |
          echo '' | base64 -d | python3

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "CDQ Automation"
          git config user.email "actions@users.noreply.github.com"
          git add AppsScript/Selector.html
          git commit -m "Update Selector: save note on first touch"
          git push origin HEAD:main
