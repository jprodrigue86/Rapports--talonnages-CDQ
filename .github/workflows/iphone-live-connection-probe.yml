name: iPhone public connection diagnostic
on:
  push:
    branches: [codex/iphone-connection-repair]
    paths: ['.github/workflows/iphone-live-connection-probe.yml', 'scripts/diagnose-iphone-rpc-layout.mjs']
permissions:
  contents: read
jobs:
  public-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps webkit
      - name: Compare layout with real Google and anonymous read-only calls
        run: node scripts/diagnose-iphone-rpc-layout.mjs
