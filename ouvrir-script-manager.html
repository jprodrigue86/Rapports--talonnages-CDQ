<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131f">
<title>Ouvrir CDQ Script Manager</title>
<style>
html,body{margin:0;min-height:100%;background:#050c14;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:grid;place-items:center;padding:22px;box-sizing:border-box}
.card{width:min(430px,94vw);padding:24px;border-radius:20px;background:#0b1f30;border:1px solid #31516a;text-align:center;box-shadow:0 18px 55px rgba(0,0,0,.45)}
h1{font-size:22px;margin:0 0 10px}
p{color:#b8cddd;line-height:1.45;margin:0 0 18px}
button,a{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:13px;box-sizing:border-box;font-weight:850;font-size:16px;text-decoration:none}
button{border:1px solid #28b9f0;background:#0c3650;color:#fff}
a{margin-top:12px;border:1px solid #35536b;background:#102638;color:#fff}
.small{margin-top:14px;font-size:12px;color:#819bad}
</style>
</head>
<body>
<div class="card">
<h1>CDQ Script Manager V39</h1>
<p>Ouverture directe dans Google Chrome avec le package Balance CDQ V25.03.</p>
<button id="open" type="button">Ouvrir Script Manager dans Chrome</button>
<a id="web" href="https://jprodrigue86.github.io/Rapports--talonnages-CDQ/apps-script-manager/?bundle=v25.03" target="_top" rel="noopener">Ouvrir sans redirection</a>
<div class="small">Cette page ne passe pas par la connexion de Balance CDQ.</div>
</div>
<script>
(function(){
'use strict';
const target='https://jprodrigue86.github.io/Rapports--talonnages-CDQ/apps-script-manager/?bundle=v25.03';
function openChrome(){
  const u=new URL(target);
  const intent='intent://'+u.host+u.pathname+u.search+
    '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(target)+';end';
  try{location.href=intent;}catch(e){location.href=target;}
}
document.getElementById('open').onclick=openChrome;
if(/Android/i.test(navigator.userAgent||''))setTimeout(openChrome,220);
})();
</script>
</body>
</html>
