<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vérification connexion CDQ</title><style>body{margin:0;background:#000;color:#fff;font:16px system-ui}header{padding:12px}iframe{border:0;width:100%;height:85vh;display:block}</style><header><button id="connect" type="button">Choisir mon compte Google</button> Vérification du chargement CDQ <span id="status">…</span></header><iframe id="app" title="Application CDQ" src="https://script.google.com/macros/s/AKfycbzZt5zgKLJA3FlRXgJOqR8OLopFBkCg8vapy4fLMNM37rlrYv0U__p8V22O_QAq5gk/exec?cdq_deploy=272"></iframe><script>const APP='https://script.google.com/macros/s/AKfycbzZt5zgKLJA3FlRXgJOqR8OLopFBkCg8vapy4fLMNM37rlrYv0U__p8V22O_QAq5gk/exec?cdq_deploy=272';let loginWindow;document.getElementById('connect').onclick=function(){loginWindow=window.open('https://accounts.google.com/AccountChooser?continue='+encodeURIComponent(APP+'&cdq_connect=1'),'cdq-google-connection');};window.addEventListener('message',function(e){if(e.data&&e.data.type==='CDQ_GOOGLE_CONNECTED'&&loginWindow&&/^https:\/\/(?:script\.google\.com|script\.googleusercontent\.com|[a-z0-9-]+-script\.googleusercontent\.com)$/.test(e.origin)){try{if(e.source!==loginWindow&&e.source.top!==loginWindow)return;}catch(x){return;}try{loginWindow.close();}catch(x){}document.getElementById('app').src=APP+'&retry='+Date.now();}});window.addEventListener('message',function(e){if(e.data&&e.data.type==='CDQ_SELECTOR_READY')document.getElementById('status').textContent='Interface chargée';if(e.data&&e.data.type==='CDQ_ACCESS_STATE'&&e.data.state==='input')document.getElementById('status').textContent='Saisie disponible';});</script></html>
