<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Réparer Balance CDQ PC</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020911;color:#eef7fb;font-family:Segoe UI,system-ui,sans-serif}
main{width:min(620px,92vw);padding:28px;border:1px solid #28536a;border-radius:18px;background:#071724;box-sizing:border-box}
h1{margin:0 0 14px;font-size:26px}.status{padding:14px;border-radius:10px;background:#0b2233;color:#9edcff;white-space:pre-wrap}
button{width:100%;min-height:54px;margin-top:16px;border:0;border-radius:12px;background:#43c98b;color:#05251b;font-size:17px;font-weight:900;cursor:pointer}
small{display:block;margin-top:14px;color:#9db2bd;line-height:1.4}
</style>
</head>
<body><main>
<h1>Réparer Balance CDQ PC</h1>
<div class="status" id="status">Préparation…</div>
<button id="go">Réparer et ouvrir Balance CDQ</button>
<small>Cette opération supprime uniquement l’ancien cache de l’application Rapports sur ce navigateur. Vos fichiers Drive, rapports et données clients ne sont pas supprimés.</small>
</main>
<script>
const status=document.getElementById('status'),go=document.getElementById('go');
async function repair(){
  go.disabled=true;
  try{
    status.textContent='1/3 Suppression des anciens caches Rapports…';
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('cdq-reports-independent-')).map(k=>caches.delete(k)));
    }
    status.textContent='2/3 Retrait de l’ancien service worker PC…';
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>new URL(r.scope).pathname.startsWith('/Rapports--talonnages-CDQ/reports/')).map(r=>r.unregister()));
    }
    status.textContent='3/3 Réouverture avec la nouvelle enveloppe PC…';
    const u=new URL('./',location.href);
    u.searchParams.set('pc_repaired','2237');
    u.searchParams.set('ts',Date.now());
    setTimeout(()=>location.replace(u.href),500);
  }catch(e){
    status.textContent='Erreur de réparation : '+(e&&e.message||e);
    go.disabled=false;
  }
}
go.addEventListener('click',repair);
setTimeout(repair,500);
</script></body></html>
